[project]
name = "shopper-intent"
version = "0.1.0"
description = "Sistema preditivo de propensão de compra (Online Shoppers Intention)."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "scikit-learn>=1.5,<2",
    "pandas>=2.2,<3",
    "mlflow>=2.16,<4",
    "pydantic-settings>=2.5,<3",
    "pyyaml>=6.0,<7",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "joblib (>=1.4,<2)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "shopper_intent", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-cov = "^5.0"
ruff = "^0.17.3"
jupyter = "^1.1"
matplotlib = "^3.9"
seaborn = "^0.13"

[tool.poetry.group.pipeline.dependencies]
dvc = "^3.55"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["shopper_intent"]
