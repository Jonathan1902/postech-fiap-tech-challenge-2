seed: 42

data:
  raw_path: data/raw/online_shoppers_intention.csv
  train_path: data/processed/train.csv
  test_path: data/processed/test.csv
  target: Revenue

split:
  test_size: 0.2

features:
  numeric:
    - Administrative
    - Administrative_Duration
    - Informational
    - Informational_Duration
    - ProductRelated
    - ProductRelated_Duration
    - BounceRates
    - ExitRates
    - PageValues
    - SpecialDay
  # Numéricas que na verdade são códigos categóricos entram aqui (One-Hot, sem escala).
  categorical:
    - Month
    - OperatingSystems
    - Browser
    - Region
    - TrafficType
    - VisitorType

train:
  primary_metric: average_precision
  threshold: 0.5
  model_path: models/model.pkl
  metrics_path: reports/metrics.json
  models:
    logistic_regression:
      C: 1.0
      max_iter: 1000
      class_weight: balanced
    random_forest:
      n_estimators: 300
      max_depth: 12
      min_samples_leaf: 2
      class_weight: balanced
    hist_gradient_boosting:
      learning_rate: 0.05
      max_iter: 300
      max_leaf_nodes: 15
      class_weight: balanced

register:
  output_path: reports/registry.json
