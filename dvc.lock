    params:
      params.yaml:
        data:
          raw_path: data/raw/online_shoppers_intention.csv
          train_path: data/processed/train.csv
          test_path: data/processed/test.csv
          target: Revenue
        features:
          numeric:
          - Administrative
          - Administrative_Duration
          - Informational
          - Informational_Duration
          - ProductRelated
          - ProductRelated_Duration
          - BounceRates
          - ExitRates
          - PageValues
          - SpecialDay
          categorical:
          - Month
          - OperatingSystems
          - Browser
          - Region
          - TrafficType
          - VisitorType
        seed: 42
        train:
          primary_metric: average_precision
          threshold: 0.5
          model_path: models/model.pkl
          metrics_path: reports/metrics.json
          models:
            logistic_regression:
              C: 1.0
              max_iter: 1000
              class_weight: balanced
            random_forest:
              n_estimators: 300
              max_depth: 12
              min_samples_leaf: 2
              class_weight: balanced
            hist_gradient_boosting:
              learning_rate: 0.05
              max_iter: 300
              max_leaf_nodes: 15
              class_weight: balanced
    outs:
    - path: models/model.pkl
      hash: md5
      md5: b57ea40ec0f4fb353f094b56e0463d37
      size: 568361
    - path: reports/metrics.json
      hash: md5
