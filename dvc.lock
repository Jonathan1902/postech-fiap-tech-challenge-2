          target: Revenue
        features:
          numeric:
          - Administrative
          - Administrative_Duration
          - Informational
          - Informational_Duration
          - ProductRelated
          - ProductRelated_Duration
          - BounceRates
          - ExitRates
          - PageValues
          - SpecialDay
          categorical:
          - Month
          - OperatingSystems
          - Browser
          - Region
          - TrafficType
          - VisitorType
        seed: 42
        train:
          primary_metric: average_precision
          cv_folds: 5
          threshold: 0.5
          model_path: models/model.pkl
          metrics_path: reports/metrics.json
          best_run_path: reports/best_run.json
          models:
            logistic_regression:
              C: 1.0
              max_iter: 1000
              class_weight: balanced
            random_forest:
              n_estimators: 300
              max_depth: 12
              min_samples_leaf: 2
              class_weight: balanced
            hist_gradient_boosting:
              learning_rate: 0.05
              max_iter: 300
              max_leaf_nodes: 15
              class_weight: balanced
